# Push to main → tests → deploy to Cloudflare (note.directory).
# Pull requests run the tests only.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push replaces a deploy still waiting; a running one finishes.
# Per ref, so pull request runs never replace a waiting deploy of main
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: storage tests run the previous release from git
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Serial: some UI tests are timing-sensitive under parallel load.
      # Storage runs in all three engines — it holds everyone's notes
      - run: npx playwright test --workers=1
        env:
          ALL_BROWSERS: "1"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.151.1"
